name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install ruff pytest pytest-asyncio
          pip install -e ".[dev]" || pip install -r requirements.txt || true

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Unit tests
        run: pytest tests/ -v --tb=short

  pii-gate:
    name: PII redaction gate
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ingestion deps
        run: |
          pip install --upgrade pip
          pip install presidio-analyzer presidio-anonymizer spacy
          python -m spacy download en_core_web_sm

      - name: Assert zero PII in sample corpus index
        run: python tests/test_pii_redaction.py

  eval-gate:
    name: RAG eval gate (faithfulness ≥ 0.80)
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Only runs when eval/ golden set exists (skips during early milestones)
    if: hashFiles('eval/golden_set.jsonl') != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install eval deps
        run: pip install ragas langchain openai anthropic qdrant-client

      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'anthropic' }}
        run: python eval/ci_gate.py --min-faithfulness 0.80 --min-recall-at-5 0.75
